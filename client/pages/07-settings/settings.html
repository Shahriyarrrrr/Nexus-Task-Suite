<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/client/shared/css/reset.css">
<link rel="stylesheet" href="/client/shared/css/variables.css">
<link rel="stylesheet" href="/client/shared/css/utilities.css">
<link rel="stylesheet" href="settings.css">
</head>

<body>

<div id="headerMount"></div>
<div id="sidebarMount"></div>
<div id="modalMount"></div>
<div id="toastMount"></div>
<div id="footerMount"></div>

<div class="page-padding-bottom">

<div class="settings-wrapper fade-settings">

<h1 class="settings-title">Settings</h1>

<div class="settings-grid">

<div class="card">
<h3>Theme</h3>
<div class="theme-controls">
<button class="theme-btn" data-theme="light">Light</button>
<button class="theme-btn active" data-theme="dark">Dark</button>
<button class="theme-btn" data-theme="system">System</button>
</div>
</div>

<div class="card">
<h3>Layout</h3>
<div class="layout-controls">
<button class="layout-btn" data-layout="compact">Compact</button>
<button class="layout-btn active" data-layout="comfortable">Comfortable</button>
</div>
</div>

<div class="card">
<h3>Notifications</h3>
<label class="toggle">
<input type="checkbox" id="notifyToggle" checked>
<span class="switch"></span>
</label>
</div>

<div class="card">
<h3>Integrations</h3>
<div class="integration-list">
<button class="int-btn">Google Calendar</button>
<button class="int-btn">Slack</button>
</div>
</div>

</div>

</div>

</div>

<script src="/client/shared/js/init-ui.js"></script>
<script src="settings.js"></script>

</body>
</html>
